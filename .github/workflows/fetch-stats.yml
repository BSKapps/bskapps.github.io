name: Fetch Analytics Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fetch-stats.js'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone stats repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git clone https://x-access-token:${GH_PAT}@github.com/BSKapps/bsk-stats.git /tmp/bsk-stats

      - name: Fetch stats
        env:
          PRIOR_STATS_PATH: /tmp/bsk-stats/stats.json
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LS_API_KEY: ${{ secrets.LS_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_VENDOR_NUMBER: ${{ secrets.APPLE_VENDOR_NUMBER }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: node .github/scripts/fetch-stats.js

      - name: Push stats to private repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cp _data/stats.json /tmp/bsk-stats/stats.json
          cd /tmp/bsk-stats
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add stats.json
          git diff --staged --quiet || git commit -m "Update analytics stats"
          git push || (git pull --rebase --strategy-option=theirs && git push)
