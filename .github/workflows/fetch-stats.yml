name: Fetch Analytics Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fetch-stats.js'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LS_API_KEY: ${{ secrets.LS_API_KEY }}
        run: node .github/scripts/fetch-stats.js

      - name: Commit stats
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add _data/stats.json
          git diff --staged --quiet || git commit -m "Update analytics stats"
          git push
